name: Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 用仓库自带的 wrapper（gradle-wrapper.properties → 9.8.2），不要在这里写死版本：
      # AGP 9.4.1 要求 Gradle ≥ 9.6，而这里曾钉在 8.11.1，导致每次 push 都同一个错
      # 「Minimum supported Gradle version is 9.6.0. Current version is 8.11.1」。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Perf script parsing (fixtures, no device)
        run: |
          set -eu
          # 采集脚本的解析曾经三处取错字段（取到标签而不是标签后面的值），
          # 这类错误在没有设备时也能被 fixture 拦住。
          row=$(PERF_GFXINFO_FILE=scripts/fixtures/gfxinfo-sample.txt bash scripts/perf_collect.sh C)
          echo "$row"
          # 用 grep -F 比对：`case` 的模式串里 `|` 是分支分隔符，写成 "| 8ms | ..." 会被当成
          # 多个分支，匹配不到就永远失败（上一版就是这么红的）。
          printf '%s' "$row" | grep -qF '| 8ms | 18ms | 25ms |'             || { echo "gfxinfo 解析与 fixture 真值不符：$row" >&2; exit 1; }
          # 0 帧样本必须作废：Android 会打印 4950ms 占位值，照原样入表就是假数据。
          zero=$(PERF_GFXINFO_FILE=scripts/fixtures/gfxinfo-zero-frames.txt bash scripts/perf_collect.sh C)
          printf '%s' "$zero" | grep -qF '| - | - | - |'             || { echo "0 帧样本没有被作废：$zero" >&2; exit 1; }
          pss=$(awk '{ for (i=1;i<=NF;i++) if ($i=="PSS:") { print $(i+1); exit } }' scripts/fixtures/meminfo-sample.txt)
          [ "$pss" = "829857" ] || { echo "PSS 解析错：$pss" >&2; exit 1; }
          hz=$(grep -o 'renderFrameRate [0-9.]*' scripts/fixtures/display-sample.txt | head -1 | awk '{print $2}')
          [ "$hz" = "120.00001" ] || { echo "刷新率解析错：$hz" >&2; exit 1; }
          # fixture 里 `fps=` 出现三次（120/90/60，每个支持的模式一次），且第一条恰好也是
          # 120——单看数值发现不了"又退回取第一条 fps="。所以额外钉住取数来源。
          grep -q 'renderFrameRate' scripts/perf_collect.sh             || { echo "刷新率必须取 renderFrameRate，不要退回 fps= 的第一条" >&2; exit 1; }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suixing-test-report
          path: app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      # Compile instrumentation tests without an attached device; runtime PTY
      # behavior still requires separate Android device validation (#61).
      - name: Compile Android instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: suixing-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: suixing-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
