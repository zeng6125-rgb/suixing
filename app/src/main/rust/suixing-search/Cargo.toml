[package]
name = "suixing-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "suixing_search"
crate-type = ["staticlib"]

[dependencies]
libc = "=0.2.189"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["raw_value", "arbitrary_precision", "preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
