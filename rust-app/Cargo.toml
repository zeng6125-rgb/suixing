[package]
name = "suixing-rust-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
name = "suixing_rust_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "android-native-activity"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
winit = { version = "=0.30.13", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "preserve_order"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.11"
sha2 = "=0.10.9"
png = "=0.18.1"
encoding_rs = "=0.8.35"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
regex = "=1.13.1"
unicode-width = "=0.2.3"
unicode-segmentation = "=1.13.3"
libc = "=0.2.189"
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "net", "macros"] }
suixing-search = { path = "../app/src/main/rust/suixing-search", features = ["rust-app"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
